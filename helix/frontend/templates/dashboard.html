<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8f8f6; color: #1a1a1a; padding: 2rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    .tagline { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    .modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .card {
      background: #fff; border: 1px solid #e8e8e6; border-radius: 12px;
      padding: 1.25rem; text-decoration: none; color: inherit;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card-icon  { font-size: 2rem; margin-bottom: 0.5rem; }
    .card-name  { font-size: 1rem; font-weight: 600; }
    .card-desc  { font-size: 0.82rem; color: #888; margin-top: 0.3rem; line-height: 1.5; }
    .card-port  { font-size: 0.75rem; color: #bbb; margin-top: 0.75rem; }
    .health     { font-size: 0.75rem; color: #2a9d60; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>⬡ Helix</h1>
  <p class="tagline">Your modular AI workspace. Each module works standalone or together.</p>

  <div class="modules">
    {% for mod in modules %}
    <a class="card" href="{{ mod.routes_prefix }}/">
      <div class="card-icon">{{ mod.icon }}</div>
      <div class="card-name">{{ mod.name }}</div>
      <div class="card-desc">{{ mod.description }}</div>
      <div class="card-port">localhost:5000{{ mod.routes_prefix }}</div>
      <div class="health">● active</div>
    </a>
    {% endfor %}
  </div>
</body>
</html>
